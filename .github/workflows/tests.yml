name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      # The Sheets integration test is enabled below. It skips cleanly when
      # the optional repository secrets are not configured.
      RUN_SHEETS_INTEGRATION_TESTS: "1"
      SHEETS_TEST_NAME: Turnos-test
      SHEETS_TEST_TAB: Turnos
      SHEETS_TEST_TABLE: Turnos
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SHEETS_TEST_ID: ${{ secrets.SHEETS_TEST_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
